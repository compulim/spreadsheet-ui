<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">
      {
        "imports": {
          "@onting/browser": "https://cdn.jsdelivr.net/npm/@onting/browser@0.1.1-main.202610280828.b09109b/static/index.js",
          "@onting/stub": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610280824.1079aca/dist/index.js",
          "@onting/stub/": "https://cdn.jsdelivr.net/npm/@onting/stub@0.1.0-main.202610280824.1079aca/dist/",
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "expect": "https://esm.sh/expect?standalone",
          "valibot": "https://esm.sh/valibot@1.5.0",
          "worksheet": "../static/js/index.mjs"
        }
      }
    </script>
    <link href="../static/css/styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script type="module">
      import 'worksheet';
    </script>
    <worksheet-app id="spreadsheet"></worksheet-app>
    <script type="module">
      import { getStub } from '@onting/browser';
      import { createExpectMatcher } from '@onting/stub/expectMatcher.js';
      import { waitFor } from '@testduet/wait-for';
      import expect from 'expect';

      const stub = await getStub();

      // TODO: Should move `createExpectMatcher` to `@onting/stub`.
      expect.extend(createExpectMatcher(stub));

      const element = document.getElementById('spreadsheet');

      // GIVEN: Merge cell B2..C3.
      element.worksheet.edit(edit => edit.mergeCells(1, 1, 2, 2));

      // WHEN: Focus on the A2 cell.
      await stub.EXPERIMENTAL_click(document.querySelector('.grid__cell-ref--a2'));

      // WHEN: Press Tab twice.
      // The keystrokes are from https://www.w3.org/TR/webdriver1/#keyboard-actions.
      await stub.EXPERIMENTAL_type('\uE004\uE004');

      // THEN: Should land on D2.
      await waitFor(() =>
        expect(element.worksheet.selection).toEqual(
          expect.objectContaining({
            activeCell: { column: 3, row: 1 },
            range: { left: 3, top: 1, right: 3, bottom: 1 }
          })
        )
      );

      console.log('🆗');
    </script>
  </body>
</html>
